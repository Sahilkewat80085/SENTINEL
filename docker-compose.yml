version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: sentinel-db
    restart: always
    environment:
      POSTGRES_USER: sentinel
      POSTGRES_PASSWORD: sentinel_secure_pass
      POSTGRES_DB: sentinel_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinel -d sentinel_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: sentinel-redis
    restart: always
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sentinel-backend
    restart: always
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=postgresql+asyncpg://sentinel:sentinel_secure_pass@db:5432/sentinel_db
      - REDIS_URL=redis://redis:6379/0
      - GITHUB_PAT=${GITHUB_PAT:-mock_pat_not_real_token}
      - JWT_SECRET=4f4f78328c0b78dfde89c36195c80a82b9921b7145e12f6da03e91122a2bb7f1
      - LOG_LEVEL=INFO
    volumes:
      - reports_data:/app/reports
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"

  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sentinel-celery
    restart: always
    command: celery -A app.celery_app worker --loglevel=info
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=postgresql+asyncpg://sentinel:sentinel_secure_pass@db:5432/sentinel_db
      - REDIS_URL=redis://redis:6379/0
      - GITHUB_PAT=${GITHUB_PAT:-mock_pat_not_real_token}
      - JWT_SECRET=4f4f78328c0b78dfde89c36195c80a82b9921b7145e12f6da03e91122a2bb7f1
      - LOG_LEVEL=INFO
    volumes:
      - reports_data:/app/reports
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sentinel-frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "3000:3000"

  nginx:
    image: nginx:alpine
    container_name: sentinel-nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend

volumes:
  postgres_data:
  reports_data:
